version: 2

models:
  - name: gold_kpi_overview
    description: >
      One-row Gold table containing the main indicators
      used in the Power BI executive overview.

    columns:
      - name: overview_key
        description: Constant key identifying the overview row.
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: [1]

      - name: total_patients
        data_tests:
          - not_null

      - name: diagnosed_patients
        data_tests:
          - not_null

      - name: not_diagnosed_patients
        data_tests:
          - not_null

      - name: diagnosis_rate_pct
        data_tests:
          - not_null

      - name: average_age
        data_tests:
          - not_null

      - name: average_mmse
        data_tests:
          - not_null
