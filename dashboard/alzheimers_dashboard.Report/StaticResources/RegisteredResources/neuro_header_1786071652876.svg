<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="240"
     viewBox="0 0 1200 240">

  <defs>
    <linearGradient id="headerGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="55%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#5B5FEF"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FFFFFF"
            stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#FFFFFF"
            stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">
      <feDropShadow dx="0"
                    dy="8"
                    stdDeviation="10"
                    flood-color="#16343D"
                    flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0"
        y="0"
        width="1200"
        height="240"
        rx="28"
        fill="url(#headerGradient)"/>

  <circle cx="1030"
          cy="40"
          r="190"
          fill="url(#glow)"/>

  <circle cx="1120"
          cy="215"
          r="150"
          fill="url(#glow)"/>

  <g opacity="0.18"
     stroke="#FFFFFF"
     stroke-width="2">

    <path d="M710 30 L790 85 L870 45 L950 105 L1040 55 L1130 120"/>
    <path d="M730 190 L810 135 L900 180 L980 125 L1080 175 L1160 115"/>
    <path d="M790 85 L810 135"/>
    <path d="M870 45 L900 180"/>
    <path d="M950 105 L980 125"/>
    <path d="M1040 55 L1080 175"/>
  </g>

  <g fill="#FFFFFF"
     opacity="0.70">
    <circle cx="710" cy="30" r="5"/>
    <circle cx="790" cy="85" r="7"/>
    <circle cx="870" cy="45" r="5"/>
    <circle cx="950" cy="105" r="8"/>
    <circle cx="1040" cy="55" r="6"/>
    <circle cx="1130" cy="120" r="8"/>
    <circle cx="730" cy="190" r="5"/>
    <circle cx="810" cy="135" r="7"/>
    <circle cx="900" cy="180" r="6"/>
    <circle cx="980" cy="125" r="7"/>
    <circle cx="1080" cy="175" r="6"/>
    <circle cx="1160" cy="115" r="5"/>
  </g>

  <g transform="translate(865 38)"
     fill="none"
     stroke="#FFFFFF"
     stroke-width="5"
     stroke-linecap="round"
     stroke-linejoin="round"
     filter="url(#softShadow)">

    <path d="M75 15
             C45 5, 20 25, 25 55
             C5 70, 10 105, 35 115
             C25 145, 50 170, 80 160
             C92 182, 125 180, 135 155"/>

    <path d="M135 155
             C165 175, 195 155, 190 125
             C220 110, 218 75, 195 62
             C202 32, 175 10, 145 20
             C125 2, 90 5, 75 15"/>

    <path d="M110 25 L110 155"/>
    <path d="M55 55 C75 52, 84 63, 88 80"/>
    <path d="M45 112 C68 110, 83 122, 86 145"/>
    <path d="M165 48 C145 50, 135 65, 132 82"/>
    <path d="M180 115 C155 110, 140 125, 135 145"/>
  </g>

  <text x="54"
        y="88"
        fill="#FFFFFF"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="40"
        font-weight="700">
    Alzheimer's Decision Analytics
  </text>

  <text x="56"
        y="130"
        fill="#EAF8F8"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="20"
        font-weight="400">
    Patient overview, risk factors and cognitive insights
  </text>

  <rect x="56"
        y="164"
        width="230"
        height="38"
        rx="19"
        fill="#FFFFFF"
        fill-opacity="0.16"/>

  <text x="82"
        y="190"
        fill="#FFFFFF"
        font-family="Segoe UI, Arial, sans-serif"
